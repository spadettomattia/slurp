name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      # No dependency cache here: a poisoned cache could reach the publish step and its OIDC token.
      # Node 24 ships npm >= 11.5.1, which trusted publishing needs (pnpm 10 publishes through npm).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Opens the "Version packages" PR; once merged, publishes to npm, then pushes the git tags and creates the
      # GitHub releases (v2 reads what was published from the Changesets v3 output file).
      # npm auth: trusted publishing (no token); npm adds provenance by itself.
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
